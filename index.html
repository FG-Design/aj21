<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Données Capteurs</title>
  <link rel="stylesheet" href="data/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Données capteurs</h1>
  <h1>Mesures en temps réel</h1>
  <div class="charts-container">
    <div class="chart-wrapper">
      <canvas id="tensionChart"></canvas>
      <div class="chart-center-text" id="tensionValue"></div>
    </div>
    <div class="chart-wrapper">
      <canvas id="courantChart"></canvas>
      <div class="chart-center-text" id="courantValue"></div>
    </div>
  </div>
  <div class="timestamp" id="timestamp"></div>

  <script>
    const tensionChartCtx = document.getElementById('tensionChart').getContext('2d');
    const courantChartCtx = document.getElementById('courantChart').getContext('2d');

    let tensionChart, courantChart;

    function createDonutChart(ctx, value, max, label, color) {
      return new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: [label, ''],
          datasets: [{
            data: [value, max - value],
            backgroundColor: [color, '#eee'],
            borderWidth: 0
          }]
        },
        options: {
          cutout: '70%',
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: { enabled: false }
          }
        }
      });
    }

    async function updateCharts() {
      try {
        const response = await fetch('data/data.json');
        const data = await response.json();

        const tension = data.tension;
        const courant = data.courant;

        document.getElementById('tensionValue').textContent = tension.toFixed(2) + ' V';
        document.getElementById('courantValue').textContent = courant.toFixed(2) + ' A';

        const now = new Date();
        document.getElementById('timestamp').textContent =
          'Dernière mise à jour : ' + now.toLocaleTimeString();

        if (tensionChart) tensionChart.destroy();
        if (courantChart) courantChart.destroy();

        tensionChart = createDonutChart(tensionChartCtx, tension, 15, 'Tension', '#3498db');
        courantChart = createDonutChart(courantChartCtx, courant, 5, 'Courant', '#e67e22');

      } catch (error) {
        console.error('Erreur lors du chargement des données:', error);
      }
    }

    updateCharts();
    setInterval(updateCharts, 5000);
  </script>
</body>
</html>
