<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mesures Capteurs</title>
  <link rel="stylesheet" href="data/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h1>Données capteur</h1>
  <div class="charts-container">
    <div class="chart-wrapper">
      <canvas id="tensionChart"></canvas>
      <div class="chart-center-text" id="tensionValue"></div>
    </div>
    <div class="chart-wrapper">
      <canvas id="courantChart"></canvas>
      <div class="chart-center-text" id="courantValue"></div>
    </div>
  </div>
  <div class="timestamp" id="timestamp"></div>

  <script>
    const tensionCtx = document.getElementById('tensionChart').getContext('2d');
    const courantCtx = document.getElementById('courantChart').getContext('2d');
    let tensionChart, courantChart;

    function createHalfDonut(ctx, value, max, color) {
      return new Chart(ctx, {
        type: 'doughnut',
        data: {
          datasets: [{
            data: [value, max - value],
            backgroundColor: [color, '#eee'],
            borderWidth: 0
          }]
        },
        options: {
          rotation: -90,
          circumference: 180,
          cutout: '70%',
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: { enabled: false }
          }
        }
      });
    }

    async function updateCharts() {
      try {
        const response = await fetch('data/data.json');
        const data = await response.json();

        const tension = data.tension;
        const courant = data.courant;

        document.getElementById('tensionValue').textContent = tension.toFixed(2) + ' V';
        document.getElementById('courantValue').textContent = courant.toFixed(2) + ' A';

        const now = new Date();
        document.getElementById('timestamp').textContent =
          'Dernière mise à jour : ' + now.toLocaleTimeString();

        if (tensionChart) tensionChart.destroy();
        if (courantChart) courantChart.destroy();

        tensionChart = createHalfDonut(tensionCtx, tension, 15, '#3498db');
        courantChart = createHalfDonut(courantCtx, courant, 5, '#e67e22');

      } catch (error) {
        console.error('Erreur de chargement des données:', error);
      }
    }

    updateCharts();
    setInterval(updateCharts, 5000);
  </script>
</body>
</html>
