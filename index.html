<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard capteurs</title>
	<link rel="stylesheet" href="data/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/raphael/2.1.4/raphael-min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/justgage/1.2.9/justgage.min.js"></script>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h1>Données capteurs</h1>
    <div id="data"></div>
    <br>
    <div id="timestamp"></div>

    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5 text-center gauge-container">
          <div id="gauge1"></div>
          <p id="gauge1-time" class="timecode"></p>
        </div>
        <div class="col-12 col-md-6 col-lg-5 text-center gauge-container">
          <div id="gauge2"></div>
          <p id="gauge2-time" class="timecode"></p>
        </div>
      </div>
    </div>

    <script>
        function updateDisplay() {
            fetch('https://fg-design.github.io/aj21/data/data.json?nocache=' + new Date().getTime(), {
            cache: 'no-store'
            })
            .then(response => response.json())
            .then(data => {
                console.log("Tension:", data.tension);
                console.log("Courant:", data.courant);
        
                document.getElementById('data').innerHTML = `
                <p><strong>Tension :</strong> ${data.tension.toFixed(2)} V</p>
                <p><strong>Courant :</strong> ${data.courant.toFixed(2)} A</p>
                `;
                document.getElementById('timestamp').innerText = "Dernière mise à jour : " + new Date().toLocaleTimeString();
            })
            .catch(error => {
                document.getElementById('data').innerHTML = `<p>Erreur de chargement : ${error}</p>`;
                document.getElementById('timestamp').innerText = "Erreur de mise à jour : " + new Date().toLocaleTimeString();
            });
        }

        // Mise à jour initiale
          updateDisplay();

        // Rafraîchissement toutes les 5 secondes
        setInterval(updateDisplay, 5000);
    </script>

    <script>
        let gauge1, gauge2;

        function initGauges() {
          gauge1 = new JustGage({
            id: "gauge1",
            value: 0,
            min: 0,
            max: 20,
            label: "Tension",
            symbol: " V",
            showMinMax: true,
            gaugeWidthScale: 1.2,
            relativeGaugeSize: true
          });

          gauge2 = new JustGage({
            id: "gauge2",
            value: 0,
            min: 0,
            max: 100,
            label: "Courant",
            symbol: " A",
            showMinMax: true,
            gaugeWidthScale: 1.2,
            relativeGaugeSize: true
          });
        }

        function updateGauges() {
          fetch("data.json")
            .then(response => response.json())
            .then(data => {
              gauge1.refresh(data.tension);
              gauge2.refresh(data.courant);

              const now = new Date().toLocaleTimeString();
              document.getElementById("gauge1-time").innerText = "Mis à jour à : " + now;
              document.getElementById("gauge2-time").innerText = "Mis à jour à : " + now;
            })
            .catch(error => console.error("Erreur de chargement JSON:", error));
        }

        initGauges();
        updateGauges();
        setInterval(updateGauges, 5000); // Mise à jour toutes les 5 secondes
    </script>
</body>
</html>
